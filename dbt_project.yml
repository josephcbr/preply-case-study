name: 'dbt_case_study_sandbox'
version: '1.0.0'
config-version: 2

profile: 'dbt_case_study_sandbox'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  current_date: "'2026-04-17'::date"
  cycle_length: 28

models:
  dbt_case_study_sandbox:
    staging:
      +materialized: view
    core:
      +materialized: table
    marts:
      +materialized: table
