version: 2

models:
  - name: dim_date
    description: >
      A daily date dimension from 2024-01-01 to 2027-12-31, generated by
      dbt_date.get_date_dimension(). One row per calendar day, with the
      related week/month/quarter/year attributes each day rolls up to.
    columns:
      - name: date_day
        data_type: date
        description: The calendar date. Grain of this model — one row per day.
        data_tests:
          - unique
          - not_null

      - name: prior_date_day
        data_type: date
        description: The calendar day immediately before date_day.

      - name: next_date_day
        data_type: date
        description: The calendar day immediately after date_day.

      - name: prior_year_date_day
        data_type: date
        description: date_day shifted back exactly one calendar year.

      - name: prior_year_over_year_date_day
        data_type: date
        description: date_day shifted back 364 days, for weekday-aligned year-over-year comparisons.

      - name: day_of_week
        data_type: integer
        description: ISO day of week number (1 = Monday ... 7 = Sunday).

      - name: day_of_week_name
        data_type: text
        description: Full weekday name (e.g. "Monday").

      - name: day_of_week_name_short
        data_type: text
        description: Abbreviated weekday name (e.g. "Mon").

      - name: day_of_month
        data_type: double precision
        description: Day number within the month (1-31).

      - name: day_of_year
        data_type: double precision
        description: Day number within the year (1-366).

      - name: week_start_date
        data_type: date
        description: Start date (Sunday) of the calendar week containing date_day.

      - name: week_end_date
        data_type: date
        description: End date (Saturday) of the calendar week containing date_day.

      - name: prior_year_week_start_date
        data_type: date
        description: week_start_date for prior_year_over_year_date_day.

      - name: prior_year_week_end_date
        data_type: date
        description: week_end_date for prior_year_over_year_date_day.

      - name: week_of_year
        data_type: integer
        description: Calendar week number within the year.

      - name: iso_week_start_date
        data_type: date
        description: Start date (Monday) of the ISO-8601 week containing date_day.

      - name: iso_week_end_date
        data_type: date
        description: End date (Sunday) of the ISO-8601 week containing date_day.

      - name: prior_year_iso_week_start_date
        data_type: date
        description: iso_week_start_date for prior_year_over_year_date_day.

      - name: prior_year_iso_week_end_date
        data_type: date
        description: iso_week_end_date for prior_year_over_year_date_day.

      - name: iso_week_of_year
        data_type: integer
        description: ISO-8601 week number within the year.

      - name: prior_year_week_of_year
        data_type: integer
        description: week_of_year for prior_year_over_year_date_day.

      - name: prior_year_iso_week_of_year
        data_type: integer
        description: iso_week_of_year for prior_year_over_year_date_day.

      - name: month_of_year
        data_type: integer
        description: Month number (1-12).

      - name: month_name
        data_type: text
        description: Full month name (e.g. "January").

      - name: month_name_short
        data_type: text
        description: Abbreviated month name (e.g. "Jan").

      - name: month_start_date
        data_type: date
        description: First day of the month containing date_day.

      - name: month_end_date
        data_type: date
        description: Last day of the month containing date_day.

      - name: prior_year_month_start_date
        data_type: date
        description: month_start_date one calendar year before date_day.

      - name: prior_year_month_end_date
        data_type: date
        description: month_end_date one calendar year before date_day.

      - name: quarter_of_year
        data_type: integer
        description: Quarter number (1-4).

      - name: quarter_start_date
        data_type: date
        description: First day of the quarter containing date_day.

      - name: quarter_end_date
        data_type: date
        description: Last day of the quarter containing date_day.

      - name: year_number
        data_type: integer
        description: The calendar year, e.g. 2026.

      - name: year_start_date
        data_type: date
        description: First day of the year containing date_day (January 1).

      - name: year_end_date
        data_type: date
        description: Last day of the year containing date_day (December 31).
